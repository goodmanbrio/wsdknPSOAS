# ═══════════════════════════════════════════════════════════════
# CATEGORY B: 1 metric × 5 years (no batching possible)
# ═══════════════════════════════════════════════════════════════

- id: b_bby
  category: b
  company: Best Buy
  ticker: BBY
  query: >
    What was Best Buy's total revenue for each fiscal year
    from FY2015 through FY2019?
  expected_stencil:
    metrics: [Revenue]
    periods: [FY2015, FY2016, FY2017, FY2018, FY2019]
    cells:
      A1: {metric: Revenue, period: FY2015}
      B1: {metric: Revenue, period: FY2016}
      C1: {metric: Revenue, period: FY2017}
      D1: {metric: Revenue, period: FY2018}
      E1: {metric: Revenue, period: FY2019}
  expected_batches:
    # Single metric per period = no batching benefit, 5 solo retrievals
    - {id: A_1, cells: [A1], period: FY2015, statement: income_statement}
    - {id: B_1, cells: [B1], period: FY2016, statement: income_statement}
    - {id: C_1, cells: [C1], period: FY2017, statement: income_statement}
    - {id: D_1, cells: [D1], period: FY2018, statement: income_statement}
    - {id: E_1, cells: [E1], period: FY2019, statement: income_statement}
  ground_truth:
    # From BESTBUY_2019_10K.md 5-year selected financial data
    A1: {value: 40339, unit: $M, source: BESTBUY_2017_10K.md}
    B1: {value: 39528, unit: $M, source: BESTBUY_2017_10K.md}
    C1: {value: 39403, unit: $M, source: BESTBUY_2019_10K.md}
    D1: {value: 42151, unit: $M, source: BESTBUY_2019_10K.md}
    E1: {value: 42879, unit: $M, source: BESTBUY_2021_10K.md}
  notes: >
    Tests degenerate case — single metric means no batching.
    Data spans 3 different 10-K files (each covers ~3 years).
    FY2015 ended Jan 31 2015, FY2019 ended Feb 2 2019.

