[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osha-answer-sheet-summary"
version = "0.1.0"
description = "Focused research answer-sheet summary contract implementation"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
