# ═══════════════════════════════════════════════════════════════
# CATEGORY D: derived metrics (Sekei must decompose + emit formulas)
# ═══════════════════════════════════════════════════════════════

- id: d_bby
  category: d
  company: Best Buy
  ticker: BBY
  query: >
    What were Best Buy's gross profit margin and net profit margin
    for fiscal years 2022 and 2023?
  expected_stencil:
    metrics: [Gross Profit, Revenue, Net Earnings]
    periods: [FY2022, FY2023]
    # Raw cells (type: retrieve)
    cells:
      A1: {metric: Revenue, period: FY2022, type: retrieve}
      B1: {metric: Revenue, period: FY2023, type: retrieve}
      A2: {metric: Gross Profit, period: FY2022, type: retrieve}
      B2: {metric: Gross Profit, period: FY2023, type: retrieve}
      A3: {metric: Net Earnings, period: FY2022, type: retrieve}
      B3: {metric: Net Earnings, period: FY2023, type: retrieve}
    # Computed cells (type: compute)
    computed:
      gross_margin_FY2022: {formula: "A2 / A1", label: "Gross Margin FY2022"}
      gross_margin_FY2023: {formula: "B2 / B1", label: "Gross Margin FY2023"}
      net_margin_FY2022: {formula: "A3 / A1", label: "Net Margin FY2022"}
      net_margin_FY2023: {formula: "B3 / B1", label: "Net Margin FY2023"}
  expected_batches:
    # All components on income statement — batch per period
    - id: A_123
      cells: [A1, A2, A3]
      period: FY2022
      statement: income_statement
    - id: B_123
      cells: [B1, B2, B3]
      period: FY2023
      statement: income_statement
  ground_truth:
    A1: {value: 51761, unit: $M, source: BESTBUY_2023_10K.md}
    B1: {value: 46298, unit: $M, source: BESTBUY_2023_10K.md}
    A2: {value: 11640, unit: $M, source: BESTBUY_2023_10K.md}
    B2: {value: 9912, unit: $M, source: BESTBUY_2023_10K.md}
    A3: {value: 2454, unit: $M, source: BESTBUY_2023_10K.md}
    B3: {value: 1419, unit: $M, source: BESTBUY_2023_10K.md}
    # Computed ground truth
    gross_margin_FY2022: {value: 0.2249, display: "22.49%"}
    gross_margin_FY2023: {value: 0.2141, display: "21.41%"}
    net_margin_FY2022: {value: 0.0474, display: "4.74%"}
    net_margin_FY2023: {value: 0.0306, display: "3.06%"}
  notes: >
    Key test: Sekei must NOT try to retrieve "gross margin" directly.
    Must decompose into components (Revenue, Gross Profit, Net Earnings)
    and emit formulas for the derived metrics. Python evals the math.

