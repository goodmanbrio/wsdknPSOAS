# ═══════════════════════════════════════════════════════════════
# CATEGORY C: 6 metrics × 1 year (max batching)
# ═══════════════════════════════════════════════════════════════

- id: c_bby
  category: c
  company: Best Buy
  ticker: BBY
  query: >
    For Best Buy's fiscal year 2023, what were the revenue, cost of
    sales, gross profit, operating income, net earnings, and diluted EPS?
  expected_stencil:
    metrics: [Revenue, Cost of Sales, Gross Profit, Operating Income,
              Net Earnings, Diluted EPS]
    periods: [FY2023]
    cells:
      A1: {metric: Revenue, period: FY2023}
      A2: {metric: Cost of Sales, period: FY2023}
      A3: {metric: Gross Profit, period: FY2023}
      A4: {metric: Operating Income, period: FY2023}
      A5: {metric: Net Earnings, period: FY2023}
      A6: {metric: Diluted EPS, period: FY2023}
  expected_batches:
    # All 6 on the same income statement — single retrieval call
    - id: A_123456
      cells: [A1, A2, A3, A4, A5, A6]
      period: FY2023
      statement: income_statement
  ground_truth:
    A1: {value: 46298, unit: $M, source: BESTBUY_2023_10K.md}
    A2: {value: 36386, unit: $M, source: BESTBUY_2023_10K.md}
    A3: {value: 9912, unit: $M, source: BESTBUY_2023_10K.md}
    A4: {value: 1795, unit: $M, source: BESTBUY_2023_10K.md}
    A5: {value: 1419, unit: $M, source: BESTBUY_2023_10K.md}
    A6: {value: 6.29, unit: $/share, source: BESTBUY_2023_10K.md}
  notes: >
    Max batching test — all metrics from one statement, one period.
    Ideal: Sekei batches everything into 1 retrieval call.
    Acceptable: 2 batches (core + EPS) if Sekei is conservative.

