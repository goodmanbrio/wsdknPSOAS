# sekei_test_cases.yaml
# Ground-truth test cases for Sekei (設計) LLM call validation.
# 5 categories × 2 companies = 10 test cases.
# Cell naming: letter = period column, number = metric row.
#
# Purpose: run Sekei on each query, compare its output stencil/batches
# against expected structure. Ground truth values verify downstream too.

# ═══════════════════════════════════════════════════════════════
# CATEGORY A: 3 metrics × 3 years (standard stencil + batching)
# ═══════════════════════════════════════════════════════════════

- id: a_bby
  category: a
  company: Best Buy
  ticker: BBY
  query: >
    What were Best Buy's revenue, operating income, and diluted EPS
    for fiscal years 2021, 2022, and 2023?
  expected_stencil:
    metrics: [Revenue, Operating Income, Diluted EPS]
    periods: [FY2021, FY2022, FY2023]
    cells:
      A1: {metric: Revenue, period: FY2021}
      B1: {metric: Revenue, period: FY2022}
      C1: {metric: Revenue, period: FY2023}
      A2: {metric: Operating Income, period: FY2021}
      B2: {metric: Operating Income, period: FY2022}
      C2: {metric: Operating Income, period: FY2023}
      A3: {metric: Diluted EPS, period: FY2021}
      B3: {metric: Diluted EPS, period: FY2022}
      C3: {metric: Diluted EPS, period: FY2023}
  expected_batches:
    # Rev + OI on same income statement; EPS sometimes separate table
    - id: A_12
      cells: [A1, A2]
      period: FY2021
      statement: income_statement
    - id: B_12
      cells: [B1, B2]
      period: FY2022
      statement: income_statement
    - id: C_12
      cells: [C1, C2]
      period: FY2023
      statement: income_statement
    - id: A_3
      cells: [A3]
      period: FY2021
      statement: income_statement
    - id: B_3
      cells: [B3]
      period: FY2022
      statement: income_statement
    - id: C_3
      cells: [C3]
      period: FY2023
      statement: income_statement
  ground_truth:
    A1: {value: 47262, unit: $M, source: BESTBUY_2023_10K.md}
    B1: {value: 51761, unit: $M, source: BESTBUY_2023_10K.md}
    C1: {value: 46298, unit: $M, source: BESTBUY_2023_10K.md}
    A2: {value: 2391, unit: $M, source: BESTBUY_2023_10K.md}
    B2: {value: 3039, unit: $M, source: BESTBUY_2023_10K.md}
    C2: {value: 1795, unit: $M, source: BESTBUY_2023_10K.md}
    A3: {value: 6.84, unit: $/share, source: BESTBUY_2023_10K.md}
    B3: {value: 9.84, unit: $/share, source: BESTBUY_2023_10K.md}
    C3: {value: 6.29, unit: $/share, source: BESTBUY_2023_10K.md}
  notes: >
    BBY FY ends late Jan. FY2023=ended Jan 28 2023, FY2022=Jan 29 2022,
    FY2021=Jan 30 2021. All three years on BESTBUY_2023_10K income stmt.
    Acceptable if Sekei also batches EPS with Rev+OI (all on same table).

